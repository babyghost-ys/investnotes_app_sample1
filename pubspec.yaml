name: investnotes_app_sample1
description: "Keel: a sample investment notes app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_native_widgets:
    path: packages/flutter_native_widgets
  keel_localisation:
    path: packages/keel_localisation
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  material_ui: ^1.11.0
  cupertino_ui: ^1.1.6
  cupertino_icons: ^1.0.8
  go_router: ^18.1.4
  local_auth: ^3.0.2
  shared_preferences: ^2.5.6
  connectivity_plus: ^7.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    # Bar titles. One file, embedded here only: iOS's native bars register
    # this same asset at launch (see main.dart).
    - family: Source Sans 3
      fonts:
        - asset: assets/fonts/SourceSans3-Semibold.ttf
          weight: 600
  assets:
    - assets/images/splash_background.jpg
    # Every language's words, packed by `dart run keel_localisation:generate`
    # from the JSON in l10n/.
    - assets/l10n/l10n.tar.bz2
    - assets/images/splash_background_wide.jpg
