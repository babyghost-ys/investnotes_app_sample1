name: keel_localisation
description: "Keel's own localisation: per-feature JSON labels and spoken semantics, generated into typed classes and shipped as one tar.bz2 archive."
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.9.2

dependencies:
  archive: ^4.0.9
  bloc: ^9.2.1
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

executables:
  generate: generate
